<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MKC Global Logistics — Assistant</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --ink: #12202e;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #0b4a6f;
    --brand-soft: #e6f0f6;
    --accent: #0d9488;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1420;
      --panel: #121e2b;
      --ink: #e6edf5;
      --muted: #93a4b8;
      --line: #223144;
      --brand: #4aa3d6;
      --brand-soft: #16293a;
      --accent: #2dd4bf;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--brand);
    color: #fff;
    padding: 18px 20px;
  }
  header .wrap { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: rgba(255,255,255,.16);
    display: grid; place-items: center; font-weight: 700; letter-spacing: .5px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header p { margin: 2px 0 0; font-size: 12.5px; opacity: .8; }

  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  .chat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    height: min(70vh, 620px);
    overflow: hidden;
  }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 82%; padding: 10px 13px; border-radius: 13px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot  { background: var(--brand-soft); border: 1px solid var(--line); border-bottom-left-radius: 4px; align-self: flex-start; }
  .msg.user { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
  .msg.err  { background: #fee2e2; color: #7f1d1d; align-self: flex-start; border-radius: 10px; }

  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 12px; }
  .chips button {
    background: transparent; color: var(--brand); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { background: var(--brand-soft); }

  form { display: flex; gap: 10px; border-top: 1px solid var(--line); padding: 12px; background: var(--panel); }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 15px;
  }
  input[type=text]:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  button.send {
    background: var(--accent); color: #04231f; border: 0; border-radius: 10px;
    padding: 0 20px; font-weight: 650; font-size: 15px; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }

  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 16px 20px 40px; }
  footer a { color: var(--brand); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">MKC</div>
    <div>
      <h1>MKC Global Logistics</h1>
      <p>Shipment tracking, bookings and customs support</p>
    </div>
  </div>
</header>

<main>
  <div class="chat">
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button data-q="Where is my shipment MKC-24001?">Track MKC-24001</button>
      <button data-q="What documents do I need for an import booking?">Documents needed</button>
      <button data-q="I want to make a new booking.">New booking</button>
      <button data-q="How long does it take from Rotterdam to Alexandria?">Transit times</button>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="Ask about a shipment, or start a booking…" autocomplete="off" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>
  <footer>
    Also available on Telegram: <a href="https://t.me/MKC_Global_bot">@MKC_Global_bot</a> ·
    <a href="#" id="reset">clear conversation</a>
  </footer>
</main>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  const KEY = 'mkc-session-id';
  let sessionId = localStorage.getItem(KEY);
  if (!sessionId) {
    sessionId = (crypto.randomUUID?.() ?? String(Date.now() + Math.random())).slice(0, 36);
    localStorage.setItem(KEY, sessionId);
  }

  function add(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function typing() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.innerHTML = '<i></i><i></i><i></i>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function ask(text) {
    add(text, 'user');
    input.value = '';
    send.disabled = true;
    const dots = typing();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();
      dots.remove();
      if (!res.ok) add(data.error || 'Something went wrong.', 'err');
      else add(data.reply, 'bot');
    } catch (err) {
      dots.remove();
      add('Network error — is the server running?', 'err');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (text) ask(text);
  });

  document.getElementById('chips').addEventListener('click', (e) => {
    const q = e.target.dataset?.q;
    if (q) ask(q);
  });

  document.getElementById('reset').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sessionId, reset: true }),
    });
    log.innerHTML = '';
    greet();
  });

  function greet() {
    add(
      'Hello, welcome to MKC Global Logistics.\n\nI can track a shipment, take a new booking request, or answer questions about documents, ports and customs. What do you need?',
      'bot',
    );
  }

  greet();
  input.focus();
</script>
</body>
</html>
