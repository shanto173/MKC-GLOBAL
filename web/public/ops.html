<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Operations — MKY Global Forwarding</title>
<style>
  :root{
    --ground:#eef2f4;--surface:#fff;--surface-2:#f6f9fa;--surface-3:#eef3f6;
    --ink:#0f212c;--ink-2:#33505f;--muted:#67808f;
    --rule:#d2dde3;--accent:#0b6e8a;--accent-soft:#e0eef3;
    --good:#1b7357;--good-soft:#e3f2ec;--warn:#ac4a1a;--warn-soft:#faede5;
    --info:#2b5c8a;--info-soft:#e6eef7;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#081117;--surface:#0f1b23;--surface-2:#15232c;--surface-3:#1a2a34;
      --ink:#e7f0f5;--ink-2:#b4c7d2;--muted:#7c94a2;
      --rule:#223541;--accent:#52b8d6;--accent-soft:#10303c;
      --good:#4fc49b;--good-soft:#12291f;--warn:#e28a50;--warn-soft:#2c1e14;
      --info:#7fb2e0;--info-soft:#132433;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:var(--accent);color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap}
  header .sp{flex:1}
  header .who{font-size:12.5px;opacity:.85}
  .tabs{display:flex;gap:2px;background:var(--surface-2);border-bottom:1px solid var(--rule);
    padding:0 18px;overflow-x:auto}
  .tabs button{background:none;border:0;padding:11px 16px;font:inherit;font-weight:600;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 18px;
    background:var(--surface-2);border-bottom:1px solid var(--rule)}
  .bar input,.bar select{padding:7px 10px;border-radius:7px;border:1px solid var(--rule);
    background:var(--surface);color:var(--ink);font:inherit}
  .bar input[type=search]{min-width:230px}
  .bar .sp{flex:1}
  button.btn{padding:7px 14px;border:0;border-radius:7px;font:inherit;font-weight:600;cursor:pointer;
    background:var(--accent);color:#fff}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--rule)}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{max-width:1180px;margin:0 auto;padding:18px}

  .gate{max-width:400px;margin:11vh auto;background:var(--surface);padding:26px;border-radius:12px;border:1px solid var(--rule)}
  .gate h2{margin:0 0 6px;font-size:17px}
  .gate p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .gate label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .gate input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--rule);
    background:var(--surface-2);color:var(--ink);font:inherit}
  .gate button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:8px;
    background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:11px;margin-bottom:13px;overflow:hidden}
  .card .top{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap;padding:13px 15px;
    border-bottom:1px solid var(--rule);background:var(--surface-2)}
  .ref{font-family:ui-monospace,Consolas,monospace;font-weight:650}
  .veh{font-weight:600}
  .top .sp{flex:1}
  .dim{color:var(--muted);font-size:12.5px}
  .pill{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:3px;
    font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
  .pill.pending{background:var(--warn-soft);color:var(--warn)}
  .pill.confirmed,.pill.ok{background:var(--good-soft);color:var(--good)}
  .pill.rejected,.pill.cancelled{background:var(--warn-soft);color:var(--warn)}
  .pill.info{background:var(--info-soft);color:var(--info)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
    background:var(--rule);border-bottom:1px solid var(--rule)}
  .grid>div{background:var(--surface);padding:8px 15px}
  .grid dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
  .grid dd{margin:0;font-weight:600;word-break:break-word}

  .docs{padding:9px 15px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;
    border-bottom:1px solid var(--rule);font-size:13px}
  .docs a{padding:3px 10px;border:1px solid var(--rule);border-radius:999px;text-decoration:none;color:var(--accent)}
  .docs .none{color:var(--muted)}

  .act{padding:11px 15px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .act input,.act select{padding:7px 10px;border-radius:7px;border:1px solid var(--rule);
    background:var(--surface-2);color:var(--ink);font:inherit}
  .act input.note{flex:1;min-width:190px}
  .act label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .confirm{background:var(--good);color:#fff}
  .reject{background:transparent;color:var(--warn);border:1px solid var(--warn)!important}

  .events{padding:0 15px 12px;font-size:12.5px;color:var(--ink-2)}
  .events li{margin:3px 0;list-style:none;padding-left:14px;position:relative}
  .events li::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--accent)}
  .events time{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:11.5px}

  .msg{padding:9px 15px;font-size:13px}
  .msg.ok{background:var(--good-soft);color:var(--good)}
  .msg.err{background:var(--warn-soft);color:var(--warn)}
  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .note-line{color:var(--muted);font-size:12.5px;padding:0 15px 11px}
  .sub{padding:0 15px 12px;font-size:12.5px}
  .sub a{color:var(--accent);text-decoration:none}
  .sub li{list-style:none;padding:3px 0;border-bottom:1px solid var(--rule)}
  .sub li:last-child{border-bottom:0}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <h2>MKY Operations</h2>
  <p>Sign in to work the booking queue. Both values stay in this browser.</p>
  <label for="who">Your name</label>
  <input id="who" placeholder="e.g. Ariful" autocomplete="off" />
  <label for="secret">Admin secret</label>
  <input id="secret" type="password" placeholder="ADMIN_SECRET" autocomplete="off" />
  <button id="enter">Open</button>
  <p id="gateErr" style="color:#b3261e;margin-top:10px" hidden></p>
</div>

<div id="app" hidden>
  <header>
    <h1>MKY Operations</h1>
    <span class="sp"></span>
    <span class="who" id="whoLabel"></span>
    <button class="btn ghost" id="signout" style="background:rgba(255,255,255,.15);color:#fff;border:0">Sign out</button>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="bookings" aria-selected="true">Bookings</button>
    <button role="tab" data-tab="shipments" aria-selected="false">Shipments</button>
    <button role="tab" data-tab="customers" aria-selected="false">Customers</button>
  </div>

  <div class="bar">
    <select id="filter"></select>
    <input type="search" id="search" placeholder="Search reference, chassis, customer…" />
    <span class="sp"></span>
    <span class="dim" id="count"></span>
    <button class="btn ghost" id="refresh">Refresh</button>
  </div>

  <main id="list"></main>
</div>

<script>
  const SKEY = 'mky-ops-secret', NKEY = 'mky-ops-name';
  const $ = (id) => document.getElementById(id);
  let secret = localStorage.getItem(SKEY) || '';
  let operator = localStorage.getItem(NKEY) || '';
  let tab = 'bookings';

  const FILTERS = {
    bookings: [['pending_review','Awaiting review'],['confirmed','Confirmed'],['rejected','Rejected'],['all','All']],
    shipments: [['','In progress'],['delivered','Delivered'],['all','All']],
    customers: [['','All customers']],
  };
  let SHIPMENT_STATUSES = [];

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function api(path, options) {
    const sep = path.includes('?') ? '&' : '?';
    const res = await fetch(path + sep + 'secret=' + encodeURIComponent(secret), options);
    if (res.status === 401) throw new Error('unauthorised');
    return res.json();
  }

  const f = (label, value) => (value === null || value === undefined || value === '')
    ? '' : `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`;

  // ---------- bookings ----------
  function bookingCard(b) {
    const docs = b.documents?.length
      ? b.documents.map((d) => d.url
          ? `<a href="${d.url}" target="_blank" rel="noopener">${esc(d.type)} · ${esc(d.file)}</a>`
          : `<span class="none">${esc(d.type)} (no file)</span>`).join('')
      : '<span class="none">No documents sent</span>';
    const decided = ['confirmed','rejected','cancelled'].includes(b.status);
    const cls = b.status === 'confirmed' ? 'confirmed' : b.status === 'pending_review' ? 'pending' : 'rejected';

    return `<div class="card" data-ref="${esc(b.booking_ref)}" data-kind="booking">
      <div class="top">
        <span class="ref">${esc(b.booking_ref)}</span>
        <span class="veh">${esc([b.make,b.model].filter(Boolean).join(' ') || 'Vehicle')}</span>
        <span class="sp"></span>
        <span class="dim">${b.age_hours}h old</span>
        <span class="pill ${cls}">${esc(b.status.replace('_',' '))}</span>
      </div>
      <dl class="grid">
        ${f('Chassis / VIN', b.vin)}${f('Customer', b.customer_name)}${f('Contact', b.customer_contact)}
        ${f('Company', b.company)}${f('Route', (b.origin_port||'?') + ' → ' + (b.destination_port||'?'))}
        ${f('Origin country', b.origin_country)}${f('Gross weight', b.gross_weight_kg ? b.gross_weight_kg + ' kg' : '')}
        ${f('Incoterm', b.incoterm)}${f('Ready date', b.ready_date)}${f('MRN', b.mrn_number)}
        ${f('ACID', b.acid_number)}${f('MKY to obtain MRN', b.mrn_needed ? 'yes' : '')}
        ${f('Language', b.language)}${f('Notes', b.notes)}
        ${f('Decided by', b.confirmed_by)}${f('Ops notes', b.ops_notes)}
      </dl>
      <div class="docs"><strong style="font-weight:600">Documents:</strong> ${docs}
        <a href="/api/admin/label?ref=${encodeURIComponent(b.booking_ref)}&secret=${encodeURIComponent(secret)}"
           target="_blank" rel="noopener">Booking label (PDF)</a></div>
      ${decided
        ? `<div class="note-line">Decided ${b.confirmed_at ? new Date(b.confirmed_at).toLocaleString() : ''}${b.customer_told_at ? ' · customer notified' : ' · customer NOT notified'}</div>`
        : `<div class="act">
             <input class="note" placeholder="Note sent to the customer — e.g. space confirmed on MSC Aurora, ETD 12 Sep" />
             <button class="btn confirm" data-action="confirm">Confirm</button>
             <button class="btn reject" data-action="reject">Reject</button>
           </div>`}
    </div>`;
  }

  // ---------- shipments ----------
  function shipmentCard(s) {
    const events = (s.events||[]).map((e) =>
      `<li><time>${new Date(e.event_time).toLocaleDateString()}</time> ${esc(e.description)}${e.location ? ' — ' + esc(e.location) : ''}</li>`).join('');
    const options = SHIPMENT_STATUSES.map((st) =>
      `<option${st === s.status ? ' selected' : ''}>${esc(st)}</option>`).join('');

    return `<div class="card" data-id="${esc(s.shipment_id)}" data-kind="shipment">
      <div class="top">
        <span class="ref">${esc(s.shipment_id)}</span>
        <span class="veh">${esc([s.make,s.model].filter(Boolean).join(' ') || 'Vehicle')}</span>
        <span class="sp"></span>
        ${s.booking_ref ? `<span class="dim">from ${esc(s.booking_ref)}</span>` : ''}
        <span class="pill ${s.delivery_status === 'Complete' ? 'ok' : 'info'}">${esc(s.status)}</span>
      </div>
      <dl class="grid">
        ${f('Chassis / VIN', s.vin)}${f('Customer', s.customer_name)}
        ${f('Route', (s.origin_port||'?') + ' → ' + (s.destination_port||'?'))}
        ${f('Vessel', s.vessel)}${f('ETD', s.etd)}${f('ETA', s.eta)}
        ${f('MRN status', s.mrn_status)}${f('Payment', s.payment_status)}${f('Delivery', s.delivery_status)}
        ${f('ACID', s.acid_id)}${f('B/L', s.bl_number)}${f('Incoterm', s.incoterm)}
      </dl>
      <div class="act">
        <select class="st">${options}</select>
        <input class="loc" placeholder="Location" style="max-width:150px" />
        <input class="vessel" placeholder="Vessel" style="max-width:160px" value="${esc(s.vessel||'')}" />
        <input class="eta" type="date" value="${esc(s.eta||'')}" title="ETA" />
      </div>
      <div class="act" style="padding-top:0">
        <input class="note" placeholder="What happened — sent to the customer if you tick below" />
        <label><input type="checkbox" class="tell" checked /> tell the customer</label>
        <button class="btn" data-action="update">Save update</button>
      </div>
      ${events ? `<ul class="events">${events}</ul>` : ''}
    </div>`;
  }

  // ---------- customers ----------
  function customerCard(c) {
    const bookings = c.bookings.map((b) =>
      `<li><span class="ref">${esc(b.booking_ref)}</span> · ${esc(b.vehicle||'')} · ${esc(b.route)}
        <span class="pill ${b.status === 'confirmed' ? 'confirmed' : b.status === 'pending_review' ? 'pending' : 'rejected'}">${esc(b.status.replace('_',' '))}</span></li>`).join('');
    const shipments = c.shipments.map((s) =>
      `<li><span class="ref">${esc(s.shipment_id)}</span> · ${esc(s.vehicle||'')} · ${esc(s.status)}${s.eta ? ' · ETA ' + esc(s.eta) : ''}</li>`).join('');

    return `<div class="card">
      <div class="top">
        <span class="veh">${esc(c.name || 'Unknown')}</span>
        ${c.company ? `<span class="dim">${esc(c.company)}</span>` : ''}
        <span class="sp"></span>
        ${c.awaiting_review ? `<span class="pill pending">${c.awaiting_review} awaiting review</span>` : ''}
        ${c.open_shipments ? `<span class="pill info">${c.open_shipments} in transit</span>` : ''}
      </div>
      <dl class="grid">
        ${f('Contact', c.contact)}${f('Channel', c.channel)}
        ${f('Bookings', c.booking_count)}${f('Shipments', c.shipment_count)}
        ${f('First seen', c.first_seen ? new Date(c.first_seen).toLocaleDateString() : '')}
        ${f('Last seen', c.last_seen ? new Date(c.last_seen).toLocaleDateString() : '')}
      </dl>
      ${bookings ? `<ul class="sub"><strong style="font-weight:600">Bookings</strong>${bookings}</ul>` : ''}
      ${shipments ? `<ul class="sub"><strong style="font-weight:600">Shipments</strong>${shipments}</ul>` : ''}
    </div>`;
  }

  // ---------- loading ----------
  function fillFilter() {
    $('filter').innerHTML = FILTERS[tab].map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
    $('filter').hidden = FILTERS[tab].length < 2;
  }

  async function load() {
    $('list').innerHTML = '<div class="empty">Loading…</div>';
    const q = $('search').value.trim();
    const status = $('filter').value;
    try {
      if (tab === 'bookings') {
        const d = await api('/api/admin/bookings?status=' + encodeURIComponent(status || 'pending_review'));
        let rows = d.bookings || [];
        if (q) {
          const needle = q.toLowerCase();
          rows = rows.filter((b) => JSON.stringify(b).toLowerCase().includes(needle));
        }
        $('count').textContent = rows.length + ' booking' + (rows.length === 1 ? '' : 's');
        $('list').innerHTML = rows.length ? rows.map(bookingCard).join('') : '<div class="empty">Nothing here.</div>';
      } else if (tab === 'shipments') {
        const d = await api('/api/admin/shipments?status=' + encodeURIComponent(status) + (q ? '&q=' + encodeURIComponent(q) : ''));
        SHIPMENT_STATUSES = d.statuses || SHIPMENT_STATUSES;
        $('count').textContent = d.count + ' shipment' + (d.count === 1 ? '' : 's');
        $('list').innerHTML = d.shipments.length ? d.shipments.map(shipmentCard).join('') : '<div class="empty">Nothing here.</div>';
      } else {
        const d = await api('/api/admin/customers' + (q ? '?q=' + encodeURIComponent(q) : ''));
        $('count').textContent = d.count + ' customer' + (d.count === 1 ? '' : 's');
        $('list').innerHTML = d.customers.length ? d.customers.map(customerCard).join('') : '<div class="empty">Nothing here.</div>';
      }
    } catch (err) {
      if (err.message === 'unauthorised') return gate('That secret was not accepted.');
      $('list').innerHTML = '<div class="empty">Could not load: ' + esc(err.message) + '</div>';
    }
  }

  // ---------- actions ----------
  $('list').addEventListener('click', async (e) => {
    const button = e.target.closest('button[data-action]');
    if (!button) return;
    const card = button.closest('.card');
    const action = button.dataset.action;
    const note = card.querySelector('.note')?.value.trim() ?? '';
    const buttons = [...card.querySelectorAll('button')];

    if (action === 'reject' && !note) return alert('Please give a reason — it is sent to the customer.');
    buttons.forEach((b) => (b.disabled = true));

    try {
      let r, message;
      if (card.dataset.kind === 'booking') {
        r = await api('/api/admin/bookings', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ booking_ref: card.dataset.ref, action, note, operator }),
        });
        const told = r.customer_told || {};
        const how = [told.telegram && 'Telegram', told.email && 'email'].filter(Boolean).join(' and ');
        message = r.ok
          ? `${card.dataset.ref} ${r.status}.` +
            (r.shipment?.shipment_id ? ` Shipment ${r.shipment.shipment_id} opened.` : '') +
            (how ? ` Customer told by ${how}.` : ' Customer could NOT be told — contact them directly.')
          : (r.error || 'Failed');
      } else {
        r = await api('/api/admin/shipments', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            shipment_id: card.dataset.id,
            status: card.querySelector('.st').value,
            location: card.querySelector('.loc').value.trim(),
            vessel: card.querySelector('.vessel').value.trim(),
            eta: card.querySelector('.eta').value,
            note, operator,
            tell_customer: card.querySelector('.tell').checked,
          }),
        });
        message = r.ok
          ? (r.unchanged ? 'Nothing changed.' : `Updated${r.changed ? ': ' + r.changed : ''}.`) +
            (r.customer_told?.telegram ? ' Customer told.' : r.customer_told ? ' Customer not reachable on Telegram.' : '')
          : (r.error || 'Failed');
      }
      card.insertAdjacentHTML('beforeend', `<div class="msg ${r.ok ? 'ok' : 'err'}">${esc(message)}</div>`);
      setTimeout(load, 1700);
    } catch (err) {
      card.insertAdjacentHTML('beforeend', `<div class="msg err">${esc(err.message)}</div>`);
      buttons.forEach((b) => (b.disabled = false));
    }
  });

  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    fillFilter();
    load();
  });

  let timer;
  $('search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 350); });
  $('filter').addEventListener('change', load);
  $('refresh').addEventListener('click', load);
  $('signout').addEventListener('click', () => { localStorage.removeItem(SKEY); location.reload(); });

  function gate(message) {
    $('app').hidden = true; $('gate').hidden = false;
    if (message) { $('gateErr').textContent = message; $('gateErr').hidden = false; }
    $('who').value = operator;
    (operator ? $('secret') : $('who')).focus();
  }

  $('enter').addEventListener('click', () => {
    operator = $('who').value.trim() || 'operations';
    secret = $('secret').value.trim();
    if (!secret) return;
    localStorage.setItem(SKEY, secret); localStorage.setItem(NKEY, operator);
    start();
  });
  $('secret').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });

  function start() {
    $('gate').hidden = true; $('app').hidden = false;
    $('whoLabel').textContent = 'signed in as ' + operator;
    fillFilter();
    load();
  }

  if (secret) start(); else gate();
</script>
</body>
</html>
