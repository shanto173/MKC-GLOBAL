<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Moved to the MKY Global Forwarding operations desk</title>
  <!-- Without JavaScript the address still forwards, to the inbox. -->
  <meta http-equiv="refresh" content="3; url=/desk/" />
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #16191d; background: #f5f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    p { background: #fff; border: 1px solid #e2e5ea; border-radius: 8px; padding: 20px 24px; margin: 16px; }
    a { color: #1d5bd6; }
  </style>
</head>
<body>
  <p>The operations console is now the <a href="/desk/" id="go">MKY Global Forwarding operations desk</a>. Taking you there…</p>
  <!-- The old console's links (a booking, a request, a shipment) open the same
       thing in the desk; the mapping is tested in tests/console.test.mjs. -->
  <script type="module">
    import { legacyTarget } from '/desk/legacy.js';
    const to = legacyTarget(location.hash);
    document.getElementById('go').href = to;
    location.replace(to);
  </script>
</body>
</html>
